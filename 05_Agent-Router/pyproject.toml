[project]
name = "jui-ai-terminal"
version = "0.2.0"
description = "JuiAI Terminal native control service for local and remote AI providers"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<0.29",
  "mcp>=1.20,<2",
  "pyyaml>=6,<7",
  "numpy>=2,<3",
  "onnxruntime==1.32.0",
  "tokenizers==0.23.3",
  "soundfile>=0.13,<1",
  "pywin32>=310; sys_platform == 'win32'",
  "litellm-core==1.109.1",
  "filelock>=3.18,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
extend-exclude = [".runtime"]

